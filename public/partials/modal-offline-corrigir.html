  <!-- ============ MODAL: CORRIGIR OPERAÇÃO OFFLINE (formulário "papel A4") ============
       Ver public/js/app-core.js — cfgAbrirCorrecaoOperacaoOffline/
       cfgSalvarCorrecaoOperacaoOffline. Substitui o antigo painel inline
       (só início/fim/bateria) por um formulário completo, no formato de
       uma folha impressa: fundo branco, texto preto, campos "linha em
       branco pra preencher" — sem cards/desenhos, só texto, como pedido
       ("acho que assim fica mais intuitivo"). O CONTEÚDO (#offc-corpo) é
       inteiramente montado via JS (_offCorrigirFormHtml), porque depende
       de quantos traços/pausas aquela operação específica tem. -->
  <div id="offline-corrigir-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto">
    <div
      style="background:#f4f1ea;color:#1a1a1a;width:210mm;max-width:100%;min-height:150mm;box-shadow:0 24px 80px rgba(0,0,0,.6);border-radius:4px;position:relative">

      <div style="position:sticky;top:0;background:#e8e3d8;border-bottom:2px solid #1a1a1a;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-radius:4px 4px 0 0;z-index:1">
        <div style="font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.06em;font-weight:700;text-transform:uppercase;color:#1a1a1a">
          📄 Corrigir Registro Offline — antes de validar
        </div>
        <button onclick="_offCorrigirFecharModal()"
          style="background:none;border:none;color:#1a1a1a;font-size:1.3rem;cursor:pointer;line-height:1">✕</button>
      </div>

      <div id="offc-erro"
        style="display:none;margin:18px 28px 0;padding:10px 14px;background:#fde8e8;border:1px solid #c0392b;border-radius:3px;color:#8b1a1a;font-size:.82rem;font-family:'JetBrains Mono',monospace">
      </div>

      <div id="offc-corpo" style="padding:24px 28px 28px;font-family:Georgia,'Times New Roman',serif"></div>

      <div style="position:sticky;bottom:0;background:#e8e3d8;border-top:2px solid #1a1a1a;padding:14px 28px;display:flex;justify-content:flex-end;gap:12px;border-radius:0 0 4px 4px">
        <button type="button" class="btn btn-ghost" onclick="_offCorrigirFecharModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="cfgSalvarCorrecaoOperacaoOffline()">💾 Salvar correção</button>
      </div>

    </div>
  </div>
