<!-- ============ SUB TOPBAR (ABAS DE NAVEGAÇÃO) ============
     Antes era uma sidebar off-canvas (escondida fora da tela, aberta por
     cima do conteúdo via ☰ na topbar — ver histórico do arquivo). Agora é
     uma faixa fixa logo abaixo da topbar, sempre visível, com as páginas
     como abas horizontais (mesma ideia das abas de um navegador). Cada
     botão continua com o mesmo data-page/onclick="showPage(...)" de
     sempre — só a casca visual (sidebar vertical -> barra horizontal)
     mudou; a lógica de navegação em si (showPage, app-core.js) não sabe
     nem precisa saber a diferença. -->
    <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
      <div class="tabbar-scroll">
        <button class="nav-item active" title="Menu Principal" data-page="menu" onclick="showPage('menu',this)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
          <span class="nav-text">Menu Principal</span>
        </button>

        <span class="tabbar-divider" aria-hidden="true"></span>

        <button class="nav-item" title="Registrar Operação" data-page="operacao" data-hide-analista onclick="showPage('operacao',this)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span class="nav-text">Registrar Operação</span>
        </button>

        <span class="tabbar-divider" aria-hidden="true"></span>

        <button class="nav-item" title="Desempenho Turnos" data-page="turnos" onclick="showPage('turnos',this)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span class="nav-text">Desempenho Turnos</span>
        </button>

        <!-- Consolidado: cada botão leva pra tabela; o "dashboard" que era um
             item separado (Análise Operacional / Qualidade dos Traços /
             Análise de Berços) agora se acessa de DENTRO da própria tabela,
             pelo botão "Ver em Dashboard" acima dos filtros (ver
             dashboard-toggle.js) — sidebar ficava com 6 opções pra só 3
             conceitos (Operação, Traços, Berços). -->
        <button class="nav-item" title="Operação" data-page="registro" onclick="showPage('registro',this)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
          <span class="nav-text">Operação</span>
        </button>
        <button class="nav-item" title="Traços" data-page="relatorio" onclick="showPage('relatorio',this)">

            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>

          <span class="nav-text">Rastreabilidade</span>

        <span class="tabbar-divider" aria-hidden="true"></span>

        <button class="nav-item" title="Setor de Qualidade" data-page="setor-qualidade" onclick="showPage('setor-qualidade',this)">
